  <rect x="88" y="52" width="24" height="20" fill="#2a9d8f"/>
  <!-- belly -->
  <rect x="36" y="52" width="48" height="16" fill="#7dd3c4"/>
  <rect x="44" y="56" width="32" height="8" fill="#a8e6dc"/>
