  <rect x="52" y="84" width="16" height="8" fill="#f4d58d"/>
  <rect x="72" y="84" width="16" height="8" fill="#f4d58d"/>
  <!-- claws -->
  <rect x="26" y="88" width="4" height="4" fill="#e8b84a"/>
  <rect x="40" y="88" width="4" height="4" fill="#e8b84a"/>
  <rect x="50" y="88" width="4" height="4" fill="#e8b84a"/>
  <rect x="64" y="88" width="4" height="4" fill="#e8b84a"/>
  <rect x="70" y="88" width="4" height="4" fill="#e8b84a"/>
  <rect x="84" y="88" width="4" height="4" fill="#e8b84a"/>
