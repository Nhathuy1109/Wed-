<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Vườn linh thú pixel — xem trước</title>
<style>


  :root { --bg:#f6f3ea; --surface:#fffaf4; --line:#e4ddd0; --ink:#2a2a30; --muted:#6b6570; --accent:#c45c7a; --pink:#f8e8ee; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Be Vietnam Pro",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:720px; margin:0 auto; padding:1.25rem; }
  h1 { font-size:1.6rem; margin:0.2rem 0; }
  .sub { color:var(--muted); margin-bottom:1rem; }
  .stage { position:relative; height:15rem; border:1px solid var(--line); border-radius:1.5rem; overflow:hidden; background:linear-gradient(180deg,#efeaf6,var(--surface)); container-type:inline-size; }
  .ground { position:absolute; left:12px; right:12px; bottom:18px; height:2px; background:var(--line); }
  .hero-copy { position:absolute; top:0.85rem; left:0.85rem; z-index:2; max-width:14rem; padding:0.45rem 0.7rem; border-radius:0.9rem; background:rgba(255,250,244,.92); }
  .hero-copy p { margin:0; font-size:0.85rem; color:var(--accent); font-weight:600; }
  .hero-copy h2 { margin:0.15rem 0; font-size:1.15rem; }
  .hero-copy .t { color:var(--muted); font-size:0.85rem; font-weight:400; }
  .walker { position:absolute; bottom:12px; width:112px; animation:travel-circle 10s linear infinite; }
  .walker.lift { bottom:28px; }
  .face { animation:face-circle 10s linear infinite; }
  .sprite { display:block; width:112px; height:auto; image-rendering:pixelated; }
  .gait-step { animation:step .45s ease-in-out infinite; }
  .gait-hop { animation:hop .55s ease-in-out infinite; }
  .gait-waddle { animation:waddle .4s ease-in-out infinite; }
  .gait-float { animation:float 2.4s ease-in-out infinite; }
  .gait-roll { animation:roll 1.1s ease-in-out infinite; }
  .gait-prowl { animation:prowl 1.4s ease-in-out infinite; }
  .gait-slink { animation:slink .8s ease-in-out infinite; }
  .gait-pace { animation:pace .7s ease-in-out infinite; }
  .gait-glide { animation:glide 2.8s ease-in-out infinite; }
  .gait-swish { animation:swish .9s ease-in-out infinite; }
  .gait-swim { animation:swim 1.6s ease-in-out infinite; }
  .gait-undulate { animation:undulate 1.3s ease-in-out infinite; }
  .gait-soft { animation:soft .9s ease-in-out infinite; }
  .gait-dance { animation:dance .5s ease-in-out infinite; }
  @keyframes travel-circle {
    0%   { left:50%; bottom:18px; transform:translateX(-50%); }
    12%  { left:78%; bottom:28px; transform:translateX(-50%); }
    25%  { left:88%; bottom:48%; transform:translateX(-50%); }
    37%  { left:78%; bottom:calc(100% - 124px); transform:translateX(-50%); }
    50%  { left:50%; bottom:calc(100% - 120px); transform:translateX(-50%); }
    62%  { left:22%; bottom:calc(100% - 124px); transform:translateX(-50%); }
    75%  { left:12%; bottom:48%; transform:translateX(-50%); }
    87%  { left:22%; bottom:28px; transform:translateX(-50%); }
    100% { left:50%; bottom:18px; transform:translateX(-50%); }
  }
  @keyframes face-circle {
    0%,24% { transform:scaleX(1); }
    25%,74% { transform:scaleX(-1); }
    75%,100% { transform:scaleX(1); }
  }
  @keyframes step { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
  @keyframes hop { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-14px)} }
  @keyframes waddle { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }
  @keyframes float { 0%,100%{transform:translateY(4px)} 50%{transform:translateY(-14px)} }
  @keyframes roll { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg) translateY(-4px)} }
  @keyframes prowl { 0%,100%{transform:translateY(4px)} 50%{transform:translateY(0)} }
  @keyframes slink { 0%,100%{transform:translateY(6px)} 50%{transform:translateY(1px)} }
  @keyframes pace { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes glide { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes swish { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(6deg)} }
  @keyframes swim { 0%,100%{transform:translateY(6px) rotate(-6deg)} 50%{transform:translateY(-8px) rotate(6deg)} }
  @keyframes undulate { 0%,100%{transform:rotate(-7deg)} 50%{transform:rotate(7deg) translateY(-6px)} }
  @keyframes soft { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  @keyframes dance { 0%,100%{transform:rotate(-7deg)} 50%{transform:translateY(-12px) rotate(7deg)} }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:0.75rem; margin-top:1rem; }
  @media(min-width:560px){ .grid { grid-template-columns:repeat(3,1fr); } }
  .card { border:1px solid var(--line); border-radius:1rem; background:var(--surface); padding:0.5rem; text-align:left; cursor:pointer; font:inherit; color:inherit; }
  .card[aria-pressed="true"] { border-color:var(--accent); background:var(--pink); }
  .mini-stage { position:relative; height:5.5rem; border-radius:0.75rem; background:#f3efe6; overflow:hidden; }
  .mini-stage .ground { bottom:10px; }
  .mini-sprite { position:absolute; bottom:8px; left:50%; width:56px; transform:translateX(-50%); image-rendering:pixelated; }
  .card strong { display:block; margin-top:0.4rem; font-size:0.9rem; }
  .card span { display:block; font-size:0.75rem; color:var(--muted); }
  .note { margin-top:1.5rem; padding:0.75rem 1rem; border-radius:0.75rem; background:var(--pink); font-size:0.9rem; }


</style>
</head>

<script>
const walker = document.getElementById('walker');
const sprite = document.getElementById('sprite');
const nameEl = document.getElementById('name');
const traitEl = document.getElementById('trait');
document.getElementById('grid').addEventListener('click', (e) => {
  const btn = e.target.closest('.card');
  if (!btn) return;
  document.querySelectorAll('.card').forEach(c => c.setAttribute('aria-pressed','false'));
  btn.setAttribute('aria-pressed','true');
  sprite.src = btn.dataset.src;
  sprite.className = 'sprite gait-' + btn.dataset.gait;
  walker.classList.toggle('lift', btn.dataset.lift === 'true');
  nameEl.textContent = btn.dataset.name;
  traitEl.textContent = btn.dataset.trait;
  try { localStorage.setItem('linh-thu-chon', btn.dataset.id); } catch(_){}
});
try {
  const id = localStorage.getItem('linh-thu-chon');
  if (id) {
    const b = document.querySelector('.card[data-id="'+id+'"]');
    if (b) b.click();
  } else document.querySelector('.card').setAttribute('aria-pressed','true');
} catch(_){ document.querySelector('.card').setAttribute('aria-pressed','true'); }
</script>
</body>
